<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hrvatski Pridjevi — Sıfatlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1c2b3a;
    --navy-deep:#141f2b;
    --stone:#e8e3d8;
    --stone-dim:#cfc8b8;
    --red:#b5462f;
    --olive:#6f7a52;
    --gold:#c9a24b;
    --card-bg:#24384a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--stone);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    text-align:center;
    padding:32px 16px 20px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2rem;
    margin:0 0 6px;
    color:var(--gold);
    letter-spacing:0.5px;
  }
  .subtitle{
    color:var(--stone-dim);
    font-size:0.95rem;
    margin:0;
  }
  .tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:22px auto 8px;
    padding:0 16px;
    flex-wrap:wrap;
  }
  .tab-btn{
    background:transparent;
    border:1.5px solid var(--stone-dim);
    color:var(--stone);
    padding:9px 20px;
    border-radius:999px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .tab-btn.active{
    background:var(--red);
    border-color:var(--red);
    color:white;
  }
  main{
    max-width:720px;
    margin:0 auto;
    padding:10px 16px;
  }
  .view{display:none;}
  .view.active{display:block;}

  /* --- Flashcard grid --- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:12px;
    margin-top:18px;
  }
  .flip-card{
    perspective:1000px;
    height:150px;
    cursor:pointer;
  }
  .flip-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.5s;
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner{
    transform:rotateY(180deg);
  }
  .flip-face{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    border:1px solid rgba(201,162,75,0.25);
  }
  .flip-front{
    background:var(--card-bg);
  }
  .flip-front .emoji{
    font-size:2.4rem;
    margin-bottom:8px;
  }
  .flip-front .hr-word{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.15rem;
    color:var(--stone);
  }
  .flip-back{
    background:var(--olive);
    color:white;
    transform:rotateY(180deg);
  }
  .flip-back .tr-word{
    font-weight:700;
    font-size:1.1rem;
    margin-bottom:6px;
  }
  .flip-back .example{
    font-size:0.78rem;
    font-style:italic;
    color:rgba(255,255,255,0.9);
    line-height:1.35;
  }
  .flip-back .example-tr{
    font-size:0.72rem;
    color:rgba(255,255,255,0.65);
    margin-top:3px;
  }

  .filter-row{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .filter-row input{
    flex:1;
    min-width:180px;
    background:var(--card-bg);
    border:1px solid rgba(201,162,75,0.3);
    color:var(--stone);
    padding:10px 14px;
    border-radius:10px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.9rem;
  }
  .filter-row input::placeholder{color:var(--stone-dim);}

  /* --- Quiz --- */
  .quiz-box{
    margin-top:20px;
    background:var(--card-bg);
    border-radius:18px;
    padding:26px 20px;
    border:1px solid rgba(201,162,75,0.2);
  }
  .quiz-progress{
    text-align:center;
    color:var(--stone-dim);
    font-size:0.85rem;
    margin-bottom:14px;
    letter-spacing:0.5px;
  }
  .quiz-word{
    text-align:center;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:2.1rem;
    color:var(--gold);
    margin:10px 0 24px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt-btn{
    background:var(--navy);
    border:1.5px solid rgba(232,227,216,0.25);
    color:var(--stone);
    padding:14px 16px;
    border-radius:12px;
    font-size:1rem;
    text-align:left;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    transition:all 0.15s ease;
  }
  .opt-btn:active{transform:scale(0.98);}
  .opt-btn.correct{
    background:var(--olive);
    border-color:var(--olive);
    color:white;
  }
  .opt-btn.wrong{
    background:var(--red);
    border-color:var(--red);
    color:white;
  }
  .opt-btn:disabled{cursor:default;}

  .reveal-box{
    margin-top:20px;
    text-align:center;
    display:none;
  }
  .reveal-box.show{display:block;}
  .reveal-emoji{font-size:3rem;}
  .reveal-example{
    font-style:italic;
    color:var(--stone);
    margin-top:8px;
    font-size:0.95rem;
  }
  .reveal-example-tr{
    color:var(--stone-dim);
    font-size:0.85rem;
    margin-top:4px;
  }
  .next-btn{
    margin-top:18px;
    background:var(--gold);
    color:var(--navy-deep);
    border:none;
    padding:12px 28px;
    border-radius:999px;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
  }
  .score-screen{
    text-align:center;
    padding:20px 0;
  }
  .score-screen .big{
    font-family:'Fraunces', serif;
    font-size:2.4rem;
    color:var(--gold);
    margin-bottom:8px;
  }
  .restart-btn{
    margin-top:18px;
    background:var(--red);
    color:white;
    border:none;
    padding:12px 26px;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
    font-size:0.95rem;
  }
</style>
</head>
<body>

<header>
  <h1>Hrvatski Pridjevi</h1>
  <p class="subtitle">50 temel sıfat · görsel hatırlatıcılarla</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-view="explore">Keşfet</button>
  <button class="tab-btn" data-view="quiz">Test</button>
</div>

<main>

  <!-- EXPLORE VIEW -->
  <div class="view active" id="explore-view">
    <div class="filter-row">
      <input type="text" id="search-input" placeholder="Ara... (hırvatça veya türkçe)">
    </div>
    <div class="grid" id="card-grid"></div>
  </div>

  <!-- QUIZ VIEW -->
  <div class="view" id="quiz-view">
    <div class="quiz-box" id="quiz-active">
      <div class="quiz-progress" id="quiz-progress">Soru 1 / 15</div>
      <div class="quiz-word" id="quiz-word">—</div>
      <div class="options" id="quiz-options"></div>
      <div class="reveal-box" id="reveal-box">
        <div class="reveal-emoji" id="reveal-emoji"></div>
        <div class="reveal-example" id="reveal-example"></div>
        <div class="reveal-example-tr" id="reveal-example-tr"></div>
        <button class="next-btn" id="next-btn">Sonraki →</button>
      </div>
    </div>
    <div class="quiz-box score-screen" id="score-screen" style="display:none;">
      <div class="big" id="score-text">0 / 15</div>
      <p id="score-comment" style="color:var(--stone-dim);"></p>
      <button class="restart-btn" id="restart-btn">Tekrar Başla</button>
    </div>
  </div>

</main>

<script>
const DATA = [
  {hr:"dobar", tr:"iyi", emoji:"👍", ex:"Ovaj film je dobar.", extr:"Bu film iyi."},
  {hr:"loš", tr:"kötü", emoji:"👎", ex:"Vrijeme je danas loše.", extr:"Bugün hava kötü."},
  {hr:"velik", tr:"büyük", emoji:"🐘", ex:"To je velika kuća.", extr:"Bu büyük bir ev."},
  {hr:"malen", tr:"küçük", emoji:"🐭", ex:"Imam malenog psa.", extr:"Küçük bir köpeğim var."},
  {hr:"lijep", tr:"güzel", emoji:"🌸", ex:"Ti si vrlo lijepa.", extr:"Sen çok güzelsin."},
  {hr:"ružan", tr:"çirkin", emoji:"🤢", ex:"Ovaj auto je ružan.", extr:"Bu araba çirkin."},
  {hr:"sretan", tr:"mutlu", emoji:"💃", ex:"Danas sam vrlo sretan.", extr:"Bugün çok mutluyum."},
  {hr:"tužan", tr:"üzgün", emoji:"😢", ex:"Zašto si tužan?", extr:"Neden üzgünsün?"},
  {hr:"umoran", tr:"yorgun", emoji:"😴", ex:"Jako sam umoran.", extr:"Çok yorgunum."},
  {hr:"odmoran", tr:"dinlenmiş", emoji:"😌", ex:"Nakon spavanja sam odmoran.", extr:"Uyuduktan sonra dinlenmiş oldum."},
  {hr:"gladan", tr:"aç", emoji:"🍽️", ex:"Jesi li gladan?", extr:"Aç mısın?"},
  {hr:"sit", tr:"tok", emoji:"🍚", ex:"Hvala, ja sam sit.", extr:"Teşekkürler, ben tokum."},
  {hr:"žedan", tr:"susamış", emoji:"🥤", ex:"Ja sam jako žedan.", extr:"Çok susadım."},
  {hr:"bolestan", tr:"hasta", emoji:"🤒", ex:"On je danas bolestan.", extr:"O bugün hasta."},
  {hr:"zdrav", tr:"sağlıklı", emoji:"💪", ex:"Moj djed je vrlo zdrav.", extr:"Dedem çok sağlıklı."},
  {hr:"mlad", tr:"genç", emoji:"👶", ex:"Ona je još uvijek mlada.", extr:"O hâlâ genç."},
  {hr:"star", tr:"yaşlı / eski", emoji:"👴", ex:"Ovo je stara zgrada.", extr:"Bu eski bir bina."},
  {hr:"nov", tr:"yeni", emoji:"✨", ex:"Kupio sam novi telefon.", extr:"Yeni bir telefon aldım."},
  {hr:"brz", tr:"hızlı", emoji:"🏃", ex:"Njegov auto je vrlo brz.", extr:"Onun arabası çok hızlı."},
  {hr:"spor", tr:"yavaş", emoji:"🐢", ex:"Internet je danas spor.", extr:"İnternet bugün yavaş."},
  {hr:"topao", tr:"ılık / sıcak", emoji:"🌤️", ex:"Voda je lijepo topla.", extr:"Su güzelce ılık."},
  {hr:"vruć", tr:"çok sıcak", emoji:"🔥", ex:"Danas je vrlo vruće.", extr:"Bugün çok sıcak."},
  {hr:"hladan", tr:"soğuk", emoji:"❄️", ex:"Kava mi je hladna.", extr:"Kahvem soğuk."},
  {hr:"lagan", tr:"hafif", emoji:"🪶", ex:"Ova torba je lagana.", extr:"Bu çanta hafif."},
  {hr:"težak", tr:"ağır / zor", emoji:"🏋️", ex:"Ovaj kofer je težak.", extr:"Bu bavul ağır."},
  {hr:"jak", tr:"güçlü", emoji:"💪", ex:"On je jako jak.", extr:"O çok güçlü."},
  {hr:"slab", tr:"zayıf (güçsüz)", emoji:"🥀", ex:"Osjećam se slabo.", extr:"Kendimi güçsüz hissediyorum."},
  {hr:"bogat", tr:"zengin", emoji:"💰", ex:"Njegova obitelj je bogata.", extr:"Onun ailesi zengin."},
  {hr:"siromašan", tr:"fakir", emoji:"🪙", ex:"Bili su vrlo siromašni.", extr:"Çok fakirlerdi."},
  {hr:"skup", tr:"pahalı", emoji:"💸", ex:"Ovaj restoran je skup.", extr:"Bu restoran pahalı."},
  {hr:"jeftin", tr:"ucuz", emoji:"🏷️", ex:"Tražim nešto jeftinije.", extr:"Daha ucuz bir şey arıyorum."},
  {hr:"čist", tr:"temiz", emoji:"🧼", ex:"Soba je vrlo čista.", extr:"Oda çok temiz."},
  {hr:"prljav", tr:"kirli", emoji:"🧹", ex:"Auto je jako prljav.", extr:"Araba çok kirli."},
  {hr:"otvoren", tr:"açık", emoji:"🚪", ex:"Trgovina je otvorena.", extr:"Mağaza açık."},
  {hr:"zatvoren", tr:"kapalı", emoji:"🔒", ex:"Vrata su zatvorena.", extr:"Kapı kapalı."},
  {hr:"pun", tr:"dolu", emoji:"🍶", ex:"Čaša je puna.", extr:"Bardak dolu."},
  {hr:"prazan", tr:"boş", emoji:"📦", ex:"Kutija je prazna.", extr:"Kutu boş."},
  {hr:"dug", tr:"uzun (süre/mesafe)", emoji:"📏", ex:"Bio je dug dan.", extr:"Uzun bir gündü."},
  {hr:"kratak", tr:"kısa", emoji:"✂️", ex:"Film je bio kratak.", extr:"Film kısaydı."},
  {hr:"visok", tr:"uzun boylu / yüksek", emoji:"🏢", ex:"Moj brat je vrlo visok.", extr:"Kardeşim çok uzun boylu."},
  {hr:"nizak", tr:"kısa boylu / alçak", emoji:"🌱", ex:"Stol je prilično nizak.", extr:"Masa oldukça alçak."},
  {hr:"debeo", tr:"şişman / kalın", emoji:"🐻", ex:"Mačka je malo debela.", extr:"Kedi biraz şişman."},
  {hr:"mršav", tr:"zayıf (vücut)", emoji:"🥒", ex:"On je vrlo mršav.", extr:"O çok zayıf."},
  {hr:"glasan", tr:"gürültülü", emoji:"📢", ex:"Susjed je jako glasan.", extr:"Komşu çok gürültülü."},
  {hr:"tih", tr:"sessiz", emoji:"🤫", ex:"Ovo je tiho mjesto.", extr:"Burası sessiz bir yer."},
  {hr:"zauzet", tr:"meşgul", emoji:"📅", ex:"Danas sam jako zauzet.", extr:"Bugün çok meşgulüm."},
  {hr:"slobodan", tr:"serbest / boş", emoji:"🕊️", ex:"Jesi li slobodan sutra?", extr:"Yarın müsait misin?"},
  {hr:"ljut", tr:"kızgın", emoji:"😠", ex:"Zašto si tako ljut?", extr:"Neden bu kadar kızgınsın?"},
  {hr:"veseo", tr:"neşeli", emoji:"😄", ex:"Djeca su vrlo vesela.", extr:"Çocuklar çok neşeli."},
  {hr:"miran", tr:"sakin", emoji:"🧘", ex:"More je danas mirno.", extr:"Deniz bugün sakin."}
];

/* ---------- EXPLORE / FLASHCARDS ---------- */
const grid = document.getElementById('card-grid');
const searchInput = document.getElementById('search-input');

function renderGrid(list){
  grid.innerHTML = '';
  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'flip-card';
    card.innerHTML = `
      <div class="flip-inner">
        <div class="flip-face flip-front">
          <div class="emoji">${item.emoji}</div>
          <div class="hr-word">${item.hr}</div>
        </div>
        <div class="flip-face flip-back">
          <div class="tr-word">${item.tr}</div>
          <div class="example">${item.ex}</div>
          <div class="example-tr">${item.extr}</div>
        </div>
      </div>
    `;
    card.addEventListener('click', () => card.classList.toggle('flipped'));
    grid.appendChild(card);
  });
}
renderGrid(DATA);

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if(!q){ renderGrid(DATA); return; }
  const filtered = DATA.filter(d => d.hr.toLowerCase().includes(q) || d.tr.toLowerCase().includes(q));
  renderGrid(filtered);
});

/* ---------- TABS ---------- */
const tabBtns = document.querySelectorAll('.tab-btn');
tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    tabBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(btn.dataset.view + '-view').classList.add('active');
    if(btn.dataset.view === 'quiz') startQuiz();
  });
});

/* ---------- QUIZ ---------- */
const QUIZ_LEN = 15;
let quizPool = [];
let quizIndex = 0;
let score = 0;
let answered = false;

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(){
  quizPool = shuffle(DATA).slice(0, QUIZ_LEN);
  quizIndex = 0;
  score = 0;
  document.getElementById('quiz-active').style.display = 'block';
  document.getElementById('score-screen').style.display = 'none';
  showQuestion();
}

function showQuestion(){
  answered = false;
  const item = quizPool[quizIndex];
  document.getElementById('quiz-progress').textContent = `Soru ${quizIndex+1} / ${quizPool.length}`;
  document.getElementById('quiz-word').textContent = item.hr;
  document.getElementById('reveal-box').classList.remove('show');

  // build 4 options: 1 correct + 3 random wrong
  let wrongPool = DATA.filter(d => d.hr !== item.hr);
  wrongPool = shuffle(wrongPool).slice(0, 3);
  const options = shuffle([item, ...wrongPool]);

  const optWrap = document.getElementById('quiz-options');
  optWrap.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt.tr;
    btn.addEventListener('click', () => handleAnswer(btn, opt, item));
    optWrap.appendChild(btn);
  });
}

function handleAnswer(btn, opt, correctItem){
  if(answered) return;
  answered = true;
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true);

  if(opt.hr === correctItem.hr){
    btn.classList.add('correct');
    score++;
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b => { if(b.textContent === correctItem.tr) b.classList.add('correct'); });
  }

  document.getElementById('reveal-emoji').textContent = correctItem.emoji;
  document.getElementById('reveal-example').textContent = correctItem.ex;
  document.getElementById('reveal-example-tr').textContent = correctItem.extr;
  document.getElementById('reveal-box').classList.add('show');
}

document.getElementById('next-btn').addEventListener('click', () => {
  quizIndex++;
  if(quizIndex >= quizPool.length){
    finishQuiz();
  } else {
    showQuestion();
  }
});

function finishQuiz(){
  document.getElementById('quiz-active').style.display = 'none';
  document.getElementById('score-screen').style.display = 'block';
  document.getElementById('score-text').textContent = `${score} / ${quizPool.length}`;
  let comment = '';
  const ratio = score / quizPool.length;
  if(ratio === 1) comment = 'Mükemmel! Hepsi doğru. 🎉';
  else if(ratio >= 0.8) comment = 'Çok iyi gidiyorsun!';
  else if(ratio >= 0.5) comment = 'Fena değil, tekrar etmeye devam!';
  else comment = 'Sorun yok, tekrar dene — kalıcılaşacak.';
  document.getElementById('score-comment').textContent = comment;
}

document.getElementById('restart-btn').addEventListener('click', startQuiz);
</script>

</body>
</html>
